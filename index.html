  <!DOCTYPE html>
  <html lang="id">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakso Mantap — Kuliner</title>
  <meta name="description" content="Website pemesanan makanan Bakso Mantap">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
  :root{
    --bg:#f7f1e3; --surface:#fffdf8; --ink:#2d241d; --muted:#786d63;
    --primary:#a33b20; --primary2:#c65b36; --accent:#e7b75b;
    --line:#eadfce; --success:#247a48; --danger:#b3261e;
    --shadow:0 15px 45px rgba(71,45,28,.10); --radius:20px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}
  button,input,textarea,select{font:inherit}
  button{cursor:pointer}
  a{text-decoration:none;color:inherit}
  .container{width:min(1160px,92%);margin:auto}
  .topbar{background:#2d241d;color:#fff;padding:9px 0;font-size:.85rem}
  .topbar .container{display:flex;justify-content:space-between;gap:15px}
  header{position:sticky;top:0;z-index:50;background:rgba(247,241,227,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800}
  .logo{width:44px;height:44px;border-radius:14px;background:var(--primary);color:white;display:grid;place-items:center;font-size:22px}
  .brand strong{font-family:"Playfair Display",serif;font-size:1.35rem}
  .navlinks{display:flex;gap:24px;color:#554a42;font-weight:600}
  .navlinks a:hover{color:var(--primary)}
  .nav-actions{display:flex;gap:9px}
  .iconbtn,.btn{border:0;border-radius:13px;padding:11px 16px;font-weight:700}
  .iconbtn{background:white;border:1px solid var(--line);position:relative}
  .btn-primary{background:var(--primary);color:white}
  .btn-primary:hover{background:#8e2f19}
  .btn-light{background:white;border:1px solid var(--line);color:var(--ink)}
  .geo-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .badge{position:absolute;top:-7px;right:-7px;background:var(--accent);color:#382812;border-radius:50%;min-width:20px;height:20px;font-size:11px;display:grid;place-items:center}
  .hero{padding:70px 0 55px}
  .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:45px;align-items:center}
  .eyebrow{color:var(--primary);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}
  h1{font-family:"Playfair Display",serif;font-size:clamp(2.6rem,6vw,5rem);line-height:1.02;margin:13px 0 20px}
  h2{font-family:"Playfair Display",serif;font-size:2.2rem;margin:0 0 12px}
  h3{margin:0 0 8px}
  .hero p{font-size:1.08rem;line-height:1.75;color:var(--muted);max-width:620px}
  .hero-buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}
  .hero-card{min-height:420px;border-radius:32px;background:linear-gradient(145deg,#c65b36,#7e2818);box-shadow:var(--shadow);padding:0;color:white;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
  .hero-card:before{content:"";position:absolute;width:290px;height:290px;border-radius:50%;background:rgba(255,255,255,.10);right:-70px;top:-70px}
  .hero-food{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;z-index:1}
  .hero-food img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.05)}
  .hero-label{position:absolute;left:20px;top:20px;z-index:2;background:rgba(255,255,255,.15);padding:10px 15px;border-radius:13px;backdrop-filter:blur(8px);font-size:1rem;line-height:1.4}
  section{padding:60px 0}
  .section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}
  .section-head p{color:var(--muted);margin:0}
  .filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:25px}
  .filter{border:1px solid var(--line);background:white;padding:9px 15px;border-radius:999px;font-weight:700}
  .filter.active{background:var(--primary);color:white;border-color:var(--primary)}
  .menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 8px 25px rgba(70,50,35,.05)}

  /* ==========================================================
    GRID MENU
    ========================================================== */

  .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
  }


  /* ==========================================================
    KARTU PRODUK
    ========================================================== */

  .card {
      display: flex;
      flex-direction: column;

      background: var(--surface);

      border: 1px solid var(--line);

      border-radius: 20px;

      overflow: hidden;

      box-shadow: 0 8px 25px rgba(70,50,35,.08);

      transition:
          transform .25s ease,
          box-shadow .25s ease;
  }


  /* Efek hover kartu */
  .card:hover {
      transform: translateY(-5px);

      box-shadow:
          0 15px 35px rgba(80,50,20,.15);
  }


  /* ==========================================================
    GAMBAR PRODUK
    ========================================================== */

  .menu-grid .card .thumb {
      width: 100%;
      height: 290px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4efe9;
      padding: 16px;
      box-sizing: border-box;
      overflow: hidden;
      border-radius: 20px 20px 0 0;
  }


  /* Foto */
  .menu-grid .card .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      margin: 0 auto;
      border-radius: 16px;
      transition: transform .3s ease;
  }


  /* Hover foto */
  .menu-grid .card:hover .thumb img {
      transform: scale(1.03);
  }


  /* ==========================================================
    INFORMASI PRODUK
    ========================================================== */

  .card .card-body {
      padding: 22px 24px 24px;

      display: flex;

      flex-direction: column;

      flex: 1;
  }


  /* Kategori */
  .card .eyebrow {
      margin-bottom: 6px;

      font-size: 14px;

      font-weight: 700;

      letter-spacing: 1px;

      color: var(--primary);

      text-transform: uppercase;
  }


  /* Nama */
  .card h3 {
      margin: 0 0 12px;

      font-size: 23px;

      line-height: 1.3;

      color: #1d1d1d;
  }


  /* Deskripsi */
  .card p {
      margin: 0 0 20px;

      font-size: 16px;

      line-height: 1.6;

      color: var(--muted);
  }


  /* ==========================================================
    HARGA DAN TOMBOL
    ========================================================== */

  .card .price-row {
      margin-top: auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;
  }


  /* Harga */
  .card .price {
      font-size: 22px;

      font-weight: 800;

      color: var(--primary);

      white-space: nowrap;
  }


  /* Tombol */
  .card .add {
      border: 0;

      padding: 13px 20px;

      border-radius: 14px;

      background: var(--primary);

      color: white;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      transition:
          background .2s ease,
          transform .2s ease;
  }


  /* Hover tombol */
  .card .add:hover {
      background: #922f17;

      transform: translateY(-2px);
  }


  /* ==========================================================
    TABLET
    ========================================================== */

  @media (max-width: 900px) {

      .menu-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .menu-grid .card .thumb {
          height: 260px;
      }

      .hero-grid,
      .about-grid,
      .contact-grid {
          grid-template-columns: 1fr;
      }

      .nav {
          flex-wrap: wrap;
          height: auto;
          padding: 12px 0;
      }

      .navlinks {
          display: none;
      }

      .nav-actions {
          margin-left: auto;
      }

  }


  /* ==========================================================
    HP
    ========================================================== */

  @media (max-width: 600px) {

      .container {
          width: min(92%, 100%);
      }

      .topbar .container {
          flex-direction: column;
          text-align: center;
          gap: 6px;
      }

      .nav {
          height: auto;
          padding: 12px 0;
          gap: 10px;
          flex-wrap: wrap;
      }

      .brand strong {
          font-size: 1.05rem;
      }

      .hero {
          padding-top: 26px;
          padding-bottom: 22px;
      }

      .hero-card {
          min-height: 260px;
          height: 260px;
      }

      .hero-label {
          left: 12px;
          top: 12px;
          right: 12px;
          font-size: 0.8rem;
      }

      .menu-grid {
          grid-template-columns: 1fr;
      }

      .menu-grid .card .thumb {
          height: 250px;
      }

      .card h3 {
          font-size: 21px;
      }

      .card p {
          font-size: 15px;
      }

      .card .price-row {
          flex-direction: column;
          align-items: flex-start;
      }

      .card .price {
          font-size: 20px;
      }

      .card .add {
          width: 100%;
          padding: 12px 16px;
          font-size: 14px;
      }

      .form-grid {
          grid-template-columns: 1fr;
      }

      .modal {
          padding: 12px;
      }

      .modal-box {
          padding: 18px 14px;
      }

      .qris-code {
          width: 150px;
          height: 150px;
      }

      footer .container {
          flex-direction: column;
          align-items: flex-start;
      }

  }
  .add{background:var(--primary);color:#fff;border:0;border-radius:11px;padding:10px 14px;font-weight:800}
  .about-grid,.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}
  .info-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:27px}
  .info-card p{color:var(--muted);line-height:1.75}
  .features{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:20px}
  .feature{background:white;border:1px solid var(--line);padding:18px;border-radius:16px}
  .feature b{display:block;margin-bottom:6px}.feature span{color:var(--muted);font-size:.9rem}
  .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
  .gallery-item{height:190px;border-radius:18px;background:linear-gradient(135deg,#8d321d,#e8b45e);display:grid;place-items:center;color:white;font-size:65px}
  .testimonials{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .quote{background:white;border:1px solid var(--line);border-radius:18px;padding:20px}
  .stars{color:#d9981e;margin-bottom:10px}
  .quote p{color:var(--muted);line-height:1.6}
  footer{background:#2d241d;color:#eee;padding:35px 0;margin-top:40px}
  footer .container{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
  footer small{color:#cfc5bb}
  .modal{position:fixed;inset:0;background:rgba(30,20,12,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
  .modal.show{display:flex}
  .modal-box{background:var(--surface);width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:24px;padding:25px;box-shadow:var(--shadow)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .close{border:0;background:#f1e8da;border-radius:50%;width:36px;height:36px;font-size:20px}
  .cart-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
  .thumb{display:none}
  .cart-item .meta{display:flex;flex-direction:column;gap:4px;min-width:0}
  .cart-item strong{display:block;line-height:1.4}
  .qty{display:flex;align-items:center;gap:7px}.qty button{width:27px;height:27px;border:1px solid var(--line);background:white;border-radius:7px}
  .totalbox{margin-top:18px;background:#f7f0e5;padding:17px;border-radius:15px}
  .row{display:flex;justify-content:space-between;gap:15px;margin:8px 0}
  .row.total{font-size:1.15rem;font-weight:800;border-top:1px solid var(--line);padding-top:12px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
  .field.full{grid-column:1/-1}
  .field label{font-weight:700;font-size:.9rem}
  .field input,.field textarea,.field select{border:1px solid var(--line);border-radius:11px;padding:12px;background:white;outline:none}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary)}
  textarea{min-height:85px;resize:vertical}
  .payment{border:2px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
  .payment.active{border-color:var(--primary);background:#fff9f2}
  .qris-box{text-align:center;background:white;border:1px dashed #cbbda8;border-radius:15px;padding:18px;margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .qris-code{width:170px;height:170px;margin:0 auto;background:#fff;display:grid;place-items:center;border:8px solid white;box-shadow:0 3px 15px rgba(0,0,0,.12)}
  .qris-code img{max-width:100%;max-height:100%;object-fit:contain}
  .qris-placeholder{font-weight:800;color:#555}
  .note{font-size:.85rem;color:var(--muted);line-height:1.5}
  .success{color:var(--success);font-weight:700}
  .admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .admin-tab{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 13px;font-weight:700}
  .admin-tab.active{background:var(--primary);color:white}
  .admin-table{width:100%;border-collapse:collapse;background:white;border-radius:15px;overflow:hidden}
  .admin-table th,.admin-table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:.88rem}
  .status{padding:5px 9px;border-radius:999px;font-size:.76rem;font-weight:800}
  .pending{background:#fff0c7;color:#795900}.paid{background:#dff4e7;color:#17663a}.cancel{background:#fde2e0;color:#8d1f1a}
  .toast{position:fixed;right:20px;bottom:20px;background:#2d241d;color:white;padding:13px 17px;border-radius:12px;box-shadow:var(--shadow);z-index:200;display:none}
  .toast.show{display:block}
  .empty{text-align:center;color:var(--muted);padding:35px 10px}
  @media(max-width:900px){
  .hero-grid,.about-grid,.contact-grid{grid-template-columns:1fr}
  .menu-grid{grid-template-columns:repeat(2,1fr)}
  .gallery{grid-template-columns:repeat(2,1fr)}
  .testimonials{grid-template-columns:1fr}
  .features{grid-template-columns:1fr}
  .navlinks{display:none}
  }

  </style>
  </head>
  <body>

  <div class="topbar">
    <div class="container">
      <span>🍽️ Pesan makanan favoritmu dengan mudah</span>
      <span>📞 Buka setiap hari 10.00–02.00</span>
    </div>
  </div>

  <header>
    <div class="container nav">
      <a class="brand" href="#/">
        <div class="logo" style="overflow:hidden;display:grid;place-items:center;padding:0;background:transparent;border:1px solid var(--line);">
          <img src="image/logo.png" alt="Bakso Mantap Logo" style="width:100%;height:100%;object-fit:cover;display:block;" />
        </div>
        <strong>Bakso Mantap</strong>
      </a>
      <nav class="navlinks">
        <a href="#/">Beranda</a>
        <a href="#/menu">Menu</a>
        <a href="#/tentang">Tentang Kami</a>
        <a href="#/galeri">Galeri</a>
        <a href="#/kontak">Kontak</a>
      </nav>
      <div class="nav-actions">
        <button class="iconbtn" onclick="openCart()">🛒<span class="badge" id="cartCount">0</span></button>
        <button class="btn btn-primary" onclick="openCheckout()">Pesan</button>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <footer>
    <div class="container">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:32px;height:32px;border-radius:10px;overflow:hidden;display:grid;place-items:center;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);">
          <img src="image/logo.png" alt="Bakso Mantap Logo" style="width:100%;height:100%;object-fit:cover;display:block;" />
        </div>
        <strong>Bakso Mantap</strong>
        <br>
      </div>
      <div></div>
      <small>© <span id="year"></span> Bakso Mantap. Semua hak dilindungi.</small>
    </div>
  </footer>

  <div class="modal" id="modal">
    <div class="modal-box" id="modalContent"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
  /* ==========================================================
    BAKSO MANTAP — SINGLE FILE
    - Keranjang
    - Checkout
    - QRIS
    - Ongkir Rp200 / 100 meter
    - WhatsApp
    - Admin sederhana berbasis localStorage
    ========================================================== */

  const CONFIG = {
    storeName: "Bakso Mantap",
    whatsapp: "628218514153", // Nomor WhatsApp toko
    adminEmail: "admin@baksomantap.id",
    adminPassword: "baksomantap123",

    // Ongkir: Rp200 setiap 100 meter.
    shippingPerUnit: 200,
    shippingUnitMeters: 100,

    // Koordinat lokasi toko yang sudah sesuai dengan alamat asli.
    storeLat: -5.3191039,
    storeLng: 104.0053251,

    // Gambar QRIS toko.
    qrisImage: "image/qris.jpeg"
  };

  const PRODUCTS = [

      {
          id: 1,
          name: "Bakso Mie Goreng Telor",
          category: "Makanan",
          price: 13000,
          image: "image/bakso_goreng_telor.jpg",
          desc: "Bakso mie telor lezat dengan kuah gurih."
      },

      {
          id: 2,
          name: "Bakso Mie Soto Telor",
          category: "Makanan",
          price: 13000,
          image: "image/bakso_telor_soto.jpg",
          desc: "Bakso mie soto lezat dengan bumbu spesial dan telur."
      },

      {
          id: 3,
          name: "Bakso Mie Kari Telor",
          category: "Makanan",
          price: 13000,
          image: "image/bakso_telor_kari.jpg",
          desc: "Bakso mie kari lezat dengan bumbu spesial dan telur."
      },

      {
          id: 4,
          name: "Bakso Telor Bihun",
          category: "Makanan",
          price: 12000,
          image: "image/bakso_telor_bihun.jpg",
          desc: "Bakso telor bihun lezat dengan kuah gurih."
      },

      {
          id: 5,
          name: "Bakso Kuah Bening",
          category: "Makanan",
          price: 12000,
          image: "image/bakso_telor_bening.jpg",
          desc: "Bakso kuah bening lezat dengan bumbu spesial."
      }

  ];

  let cart = JSON.parse(localStorage.getItem("bakso_mantap_cart") || "[]");
  let orders = JSON.parse(localStorage.getItem("bakso_mantap_orders") || "[]");
  let currentFilter = "Semua";
  let adminLoggedIn = sessionStorage.getItem("bakso_mantap_admin") === "1";

  const rupiah = n => new Intl.NumberFormat("id-ID",{
    style:"currency",currency:"IDR",maximumFractionDigits:0
  }).format(n);

  function saveCart(){
    localStorage.setItem("bakso_mantap_cart", JSON.stringify(cart));
    updateCartCount();
  }

  function saveOrders(){
    localStorage.setItem("bakso_mantap_orders", JSON.stringify(orders));
  }

  function updateCartCount(){
    document.getElementById("cartCount").textContent =
      cart.reduce((sum,item)=>sum+item.qty,0);
  }

  function toast(message){
    const el=document.getElementById("toast");
    el.textContent=message;
    el.classList.add("show");
    setTimeout(()=>el.classList.remove("show"),2500);
  }

  function openModal(html){
    document.getElementById("modalContent").innerHTML=html;
    document.getElementById("modal").classList.add("show");
  }

  function closeModal(){
    document.getElementById("modal").classList.remove("show");
  }

  document.getElementById("modal").addEventListener("click",e=>{
    if(e.target.id==="modal") closeModal();
  });

  function addToCart(id){
    const p=PRODUCTS.find(x=>x.id===id);
    if(!p)return;
    const item=cart.find(x=>x.id===id);
    if(item)item.qty++;
    else cart.push({id:p.id,qty:1});
    saveCart();
    toast(p.name+" ditambahkan ke keranjang");
  }

  function changeQty(id,delta){
    const item=cart.find(x=>x.id===id);
    if(!item)return;
    item.qty+=delta;
    if(item.qty<=0)cart=cart.filter(x=>x.id!==id);
    saveCart();
    renderCart();
  }

  function cartSubtotal(){
    return cart.reduce((sum,item)=>{
      const p=PRODUCTS.find(x=>x.id===item.id);
      return sum+(p?p.price*item.qty:0);
    },0);
  }

  function openCart(){
    renderCart();
    document.getElementById("modal").classList.add("show");
  }

  function renderCart(){
    const subtotal=cartSubtotal();
    let html=`
      <div class="modal-head">
        <div><h2>Keranjang</h2><div class="note">${cart.length} jenis produk</div></div>
        <button class="close" onclick="closeModal()">×</button>
      </div>`;

    if(!cart.length){
      html+=`<div class="empty">🛒<br><br>Keranjang masih kosong.<br><br>
        <button class="btn btn-primary" onclick="closeModal();location.hash='#/menu'">Lihat Menu</button>
      </div>`;
    }else{
      cart.forEach(item=>{
        const p=PRODUCTS.find(x=>x.id===item.id);
        if(!p)return;
        html+=`
        <div class="cart-item">
          <div class="meta">
            <strong>${escapeHtml(p.name)}</strong>

  function calculateDistanceMeters(lat1, lng1, lat2, lng2){
    const toRad = value => (value * Math.PI) / 180;
    const earthRadius = 6371000;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
      Math.sin(dLng / 2) * Math.sin(dLng / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return earthRadius * c;
  }

  let liveLocationWatchId = null;

  function getCustomerLocation(){
    if(!navigator.geolocation){
      document.getElementById("geoStatus").textContent = "Browser Anda tidak mendukung geolocation. Silakan masukkan jarak manual.";
      return;
    }

    if(liveLocationWatchId !== null){
      navigator.geolocation.clearWatch(liveLocationWatchId);
      liveLocationWatchId = null;
    }

    document.getElementById("geoStatus").textContent = "Mengambil lokasi real-time...";

    const options = {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    };

    liveLocationWatchId = navigator.geolocation.watchPosition(
      position => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = position.coords.accuracy || 0;
        const distance = calculateDistanceMeters(lat, lng, CONFIG.storeLat, CONFIG.storeLng);
        const roundedDistance = Math.max(0, Math.round(distance));
        const distanceInput = document.getElementById("coDistance");
        const geoStatus = document.getElementById("geoStatus");
        const mapDirLink = document.getElementById("mapDirLink");

        if(distanceInput) distanceInput.value = roundedDistance;
        updateCheckoutTotal();

        const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${lat},${lng}&destination=${CONFIG.storeLat},${CONFIG.storeLng}&travelmode=driving`;
        if(mapDirLink){
          mapDirLink.href = mapsUrl;
          mapDirLink.style.display = 'inline-flex';
        }

        if(geoStatus){
          geoStatus.textContent = `Lokasi real-time: ${lat.toFixed(5)}, ${lng.toFixed(5)} — akurasi ${Math.round(accuracy)} m. Jarak sekitar ${roundedDistance} meter dari toko.`;
        }
      },
      error => {
        const geoStatus = document.getElementById("geoStatus");
        if(geoStatus){
          geoStatus.textContent = "Akses lokasi ditolak. Silakan aktifkan GPS atau masukkan jarak manual.";
        }
      },
      options
    );
  }

  function updateCheckoutTotal(){
    const distance=Math.max(0,Number(document.getElementById("coDistance")?.value||0));
    const shipping=Math.ceil(distance/CONFIG.shippingUnitMeters)*CONFIG.shippingPerUnit;
    const subtotal=cartSubtotal();
    const s=document.getElementById("coShipping");
    const t=document.getElementById("coTotal");
    if(s)s.textContent=rupiah(shipping);
    if(t)t.textContent=rupiah(subtotal+shipping);
  }

  function submitOrder(){
    const name=document.getElementById("coName").value.trim();
    const phone=document.getElementById("coPhone").value.trim();
    const address=document.getElementById("coAddress").value.trim();
    const distance=Math.max(0,Number(document.getElementById("coDistance").value||0));
    const note=document.getElementById("coNote").value.trim();

    if(!name||!phone||!address){
      toast("Nama, WhatsApp dan alamat wajib diisi");
      return;
    }

    if(distance<=0){
      toast("Masukkan jarak pengiriman");
      return;
    }

    const subtotal=cartSubtotal();
    const shipping=Math.ceil(distance/CONFIG.shippingUnitMeters)*CONFIG.shippingPerUnit;
    const total=subtotal+shipping;

    const order={
      id:"DB-"+Date.now().toString().slice(-8),
      createdAt:new Date().toISOString(),
      customer:{name,phone,address,note},
      distance,
      items:cart.map(item=>{
        const p=PRODUCTS.find(x=>x.id===item.id);
        return {id:p.id,name:p.name,price:p.price,qty:item.qty};
      }),
      subtotal,shipping,total,
      payment:{method:"QRIS",status:"PENDING"},
      status:"BARU"
    };

    orders.unshift(order);
    saveOrders();

    const lines=[
      `Halo ${CONFIG.storeName}, saya ingin memesan:`,
      ``,
      `*No. Pesanan:* ${order.id}`,
      `*Nama:* ${name}`,
      `*WhatsApp:* ${phone}`,
      `*Alamat:* ${address}`,
      `*Jarak:* ${distance} meter`,
      ``,
      `*Pesanan:*`,
      ...order.items.map(x=>`- ${x.name} x${x.qty} = ${rupiah(x.price*x.qty)}`),
      ``,
      `Subtotal: ${rupiah(subtotal)}`,
      `Ongkir: ${rupiah(shipping)}`,
      `*Total: ${rupiah(total)}*`,
      `Pembayaran: QRIS`,
      note?`Catatan: ${note}`:"",
      ``,
      `Saya akan mengirim bukti pembayaran QRIS.`
    ].filter(Boolean).join("\n");

    const wa=`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(lines)}`;

    cart=[];
    saveCart();

    openModal(`
      <div style="text-align:center;padding:15px">
        <div style="font-size:60px">✅</div>
        <h2>Pesanan dibuat</h2>
        <p class="success">Nomor pesanan: ${order.id}</p>
        <p class="note">Silakan lakukan pembayaran melalui QRIS, kemudian kirim bukti pembayaran melalui WhatsApp.</p>
        <a class="btn btn-primary" style="display:inline-block;margin-top:10px" href="${wa}" target="_blank">
          📱 Kirim Pesanan ke WhatsApp
        </a>
        <br>

    `);
  }

  function updateOrder(id){

    o.payment.status=document.getElementById("paymentStatus").value;

    saveOrders();
    closeModal();
    render();
    toast("Status pesanan diperbarui");
  }

  function escapeHtml(str){
    return String(str??"").replace(/[&<>"']/g,m=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
  }

  function route(){
    const hash=location.hash.replace(/^#/,"")||"/";
    if(hash==="/")document.getElementById("app").innerHTML=renderHome();
    else if(hash==="/menu")document.getElementById("app").innerHTML=renderMenu();
    else if(hash==="/tentang")document.getElementById("app").innerHTML=renderAbout();
    else if(hash==="/galeri")document.getElementById("app").innerHTML=renderGallery();
    else if(hash==="/kontak")document.getElementById("app").innerHTML=renderContact();
    else if(hash==="/admin")document.getElementById("app").innerHTML=adminLoggedIn?adminDashboard():renderAdminLogin();
    else document.getElementById("app").innerHTML=renderHome();
    window.scrollTo({top:0,behavior:"smooth"});
    updateCartCount();
  }

  function render(){route();}

  document.getElementById("year").textContent=new Date().getFullYear();
  window.addEventListener("hashchange",route);
  route();
  updateCartCount();
  </script>
